<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Music Theory Master{% endblock %}</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background-ambient"></div>
    
    <nav class="glass-nav">
        <div class="logo">Music<span class="highlight">Theory</span></div>
        <div class="nav-links">
            <a href="/" class="nav-item">Home</a>
            <a href="#" class="nav-item">Progress</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</html>
